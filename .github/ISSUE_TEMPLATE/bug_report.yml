name: Bug report
description: The game crashes, freezes, looks wrong or will not start
body:
  - type: markdown
    attributes:
      value: |
        Please check first:
        - You use the newest release (see the Releases page). Many reports are already fixed there.
        - The problem is not listed in the open issues. Add your log to that issue instead of opening a new one.
        - One problem per issue.

        Without the log files an issue usually cannot be solved, so please attach them. The easy way: open the launcher, go to the General tab, press **Save a bug report** (Help card) and drag the `bug-report.zip` it makes into the box below. It holds everything listed here.

        Or by hand: open the folder next to `DriveClub.exe`, go into `logs`, and drag these files into the box below:
        - the newest `driveclub_<date>_<time>.log` (one per start: take the one from the run that went wrong)
        - `launcher.log` (it also exists when the game never started, for example when the launcher shows an error)
        - any `crash_*.dmp` (a small file written when the game crashes). Please attach it, it often shows the exact cause.
        - if the game froze: keep it frozen for about 20 seconds before closing it. The log then holds a hang report.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded, for example 0.3.0 (it is in `version.txt` and at the top of the log)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: Drag the files from the `logs` folder here (log, launcher.log and any crash_*.dmp)
    validations:
      required: true
  - type: checkboxes
    id: attached
    attributes:
      label: Attached
      options:
        - label: I attached the newest `driveclub_*.log`
          required: true
        - label: I attached `launcher.log`
          required: true
        - label: I attached the `crash_*.dmp` if the game crashed
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you were doing when it went wrong (menu, loading, which event and car), what you expected and what you saw instead. Add a screenshot for anything visual.
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it happen
      options:
        - Every time
        - Only the first start after installing
        - Only on later starts (not the first)
        - Only after restarting or retrying a race
        - Random
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Graphics card and processor
      description: For example "RTX 4060 Ti, Ryzen 5 5600"
  - type: input
    id: driver
    attributes:
      label: Graphics driver version and Windows version
      description: 'For example "AMD 26.5.1, Windows 11 24H2" (on Linux: kernel and Mesa or Proton version)'
  - type: textarea
    id: settings
    attributes:
      label: Launcher settings
      description: Resolution, render size, upscaler (DLSS, FSR, DLAA), frame generation, frame rate setting, and any mods or patches you turned on
  - type: checkboxes
    id: tried
    attributes:
      label: Tried already
      options:
        - label: I deleted the folder `data\user\cache` and started again (for crashes that began after the first start)
        - label: I tried a clean extract of the newest release in a new folder
