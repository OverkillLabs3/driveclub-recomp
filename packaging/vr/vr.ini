# VR (experimental): optional settings, see packaging/vr/README.md. Copy next to DriveClubGame.exe (runtime\vr.ini).
# A vr.ini also turns VR on without the launcher's switch.

# Stereo by alternate frames (1) or one picture for both eyes (0)
afr = 1
# Metres between the eyes
ipd = 0.063
# The camera fixed to the car body (1) or the game's head on springs (0)
rigid = 1
# Where the eyes sit relative to the game's head point, metres (x left, y up, z forward).
# 2/1 (up/down), 5/6 (left/right) and 4/3 (forward/back) move it while driving and print the values to keep here.
seat_x = 0
seat_y = -1.11
seat_z = 0
# Steadies a head that holds still (0: off)
smoothing = 1
# The cockpit camera's vertical field of view in the headset, degrees (VR sets it while on)
cockpit_vfov = 90
# Keys: one character, F1..F12, pageup, pagedown, home, end, insert, delete, space or tab (the keypad works too)
key_recentre = 0
key_up = 2
key_down = 1
key_left = 5
key_right = 6
key_forward = 4
key_back = 3
